<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>IQPlay — Aviator</title>
    <link rel="shortcut icon" href="https://d1fgjcawmsd6te.cloudfront.net/TemplateData/favicon.ico">
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%; height: 100%;
        background: #0d0d1a;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 0;
      }
      #unity-container { position: relative; }
      #unity-canvas { display: block; }
      #unity-loading-bar {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
      }
      #unity-logo {
        width: 154px; height: 130px;
        background: url('https://d1fgjcawmsd6te.cloudfront.net/TemplateData/unity-logo-dark.png') no-repeat center;
        margin: 0 auto 10px;
      }
      #unity-progress-bar-empty {
        width: 200px; height: 8px;
        background: #1a1a2e;
        border-radius: 4px;
        overflow: hidden;
      }
      #unity-progress-bar-full {
        height: 100%;
        background: #f97316;
        width: 0%;
        transition: width 0.1s;
      }
      #unity-footer { display: none; }
      #unity-warning { color: #f87171; font-size: 12px; text-align: center; margin-top: 8px; }
      body { cursor: none; }
      #unity-container { cursor: default; }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width=1080 height=1920 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
      <div id="unity-footer"></div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      var NATIVE_W = 1080;
      var NATIVE_H = 1920;
      var PAD_V = 40;
      function resizeCanvas() {
        var vw = window.innerWidth;
        var vh = window.innerHeight - PAD_V * 2;
        var aspect = NATIVE_W / NATIVE_H;
        var w, h;
        if (vw / vh < aspect) { w = vw;  h = vw / aspect; }
        else                  { h = vh;  w = vh * aspect;  }
        w = Math.round(w); h = Math.round(h);
        canvas.style.width  = w + "px";
        canvas.style.height = h + "px";
        document.getElementById("unity-container").style.width  = w + "px";
        document.getElementById("unity-container").style.height = h + "px";
      }
      resizeCanvas();
      window.addEventListener("resize", resizeCanvas);

      function unityShowBanner(msg, type) {
        document.querySelector("#unity-warning").innerHTML = msg;
      }

      // Build files served from CloudFront; this page served locally so
      // game API/WebSocket calls to localhost are private-to-private (no PNA).
      var buildUrl = "https://d1fgjcawmsd6te.cloudfront.net/Build";
      var loaderUrl = buildUrl + "/Build.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Build.data.br",
        frameworkUrl: buildUrl + "/Build.framework.js.br",
        codeUrl: buildUrl + "/Build.wasm.br",
        streamingAssetsUrl: "https://d1fgjcawmsd6te.cloudfront.net/StreamingAssets",
        companyName: "DefaultCompany",
        productName: "AviatorColyseus",
        productVersion: "0.1.31",
        showBanner: unityShowBanner,
      };

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.crossOrigin = "anonymous";
      script.onload = function() {
        createUnityInstance(canvas, config, function(progress) {
          document.querySelector("#unity-progress-bar-full").style.width = (100 * progress) + "%";
        }).then(function(unityInstance) {
          window._unityInstance = unityInstance;
          document.querySelector("#unity-loading-bar").style.display = "none";
        }).catch(function(message) {
          var errorDiv = document.createElement("div");
          errorDiv.style = "position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#1a1a1a;color:#ff4444;padding:20px;border-radius:8px;font-family:sans-serif;text-align:center;z-index:999;";
          errorDiv.innerHTML = "<b>Failed to load game</b><br><small>" + message + "</small>";
          document.body.appendChild(errorDiv);
        });
      };

      document.body.appendChild(script);

      // Dev log forwarder — active only when ?env=dev is in the URL
      if (window.location.search.indexOf('env=dev') !== -1) {
        (function() {
          var _devLog = function(level, args) {
            try {
              fetch('/dev/log', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ level: level, msg: Array.from(args).map(function(a) {
                  try { return typeof a === 'object' ? JSON.stringify(a) : String(a); } catch(e) { return String(a); }
                }).join(' ') })
              }).catch(function(){});
            } catch(e) {}
          };
          var _orig = { log: console.log, warn: console.warn, error: console.error };
          console.log   = function() { _orig.log.apply(console, arguments);   _devLog('log',   arguments); };
          console.warn  = function() { _orig.warn.apply(console, arguments);  _devLog('warn',  arguments); };
          console.error = function() { _orig.error.apply(console, arguments); _devLog('error', arguments); };
        })();
      }

      // Mute/unmute Unity audio when the tab is hidden or the window is minimized.
      function _notifyFocus(visible) {
        if (window._unityInstance)
          window._unityInstance.SendMessage("AudioManager", "NotifyFocusChange", visible ? "1" : "0");
      }
      document.addEventListener("visibilitychange", function() {
        _notifyFocus(!document.hidden);
      });

      window.addEventListener("message", function(e) {
        // Only accept messages from the direct parent frame (the operator portal that embedded this game)
        if (e.source !== window.parent) return;
        if (!e.data || !window._unityInstance) return;
        if (e.data.type === "iqplay_topup") {
          var amount = parseFloat(e.data.amount);
          if (!isNaN(amount) && amount !== 0)
            window._unityInstance.SendMessage("ColyseusManager", "AddBalance", amount.toString());
        }
        if (e.data.type === "iqplay_balance_refresh") {
          window._unityInstance.SendMessage("ColyseusManager", "RequestBalanceRefresh", "");
        }
        if (e.data.type === "iqplay_balance_update" && e.data.balance != null) {
          console.log("[game.html] iqplay_balance_update received, balance=" + e.data.balance);
          window._unityInstance.SendMessage("ColyseusManager", "DirectBalanceUpdate", String(e.data.balance));
        }
      });
    </script>
  </body>
</html>
